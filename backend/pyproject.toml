[project]
name = "incubyte-salary-api"
version = "0.1.0"
description = "Salary management assessment backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.13,<3",
  "uvicorn>=0.48,<1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
