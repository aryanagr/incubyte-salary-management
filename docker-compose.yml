services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_app
      POSTGRES_PASSWORD: salary_app_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_app -d salary_management"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - salary_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://salary_app:salary_app_local@db:5432/salary_management
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  salary_pgdata:
